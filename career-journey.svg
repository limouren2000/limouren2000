<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Limouren 的学习与职业路线</title>
  <desc id="desc">一辆小车从2本软件工程出发，依次经过后端开发两年半、英国计算机科学硕士，最终抵达大模型。</desc>

  <style>
    :root {
      --text: #24292f;
      --muted: #57606a;
      --road: #d0d7de;
      --lane: #ffffff;
      --card: #f6f8fa;
      --blue: #0969da;
      --green: #1a7f37;
      --orange: #bf8700;
      --purple: #8250df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f0f6fc;
        --muted: #8c959f;
        --road: #30363d;
        --lane: #8c959f;
        --card: #161b22;
        --blue: #58a6ff;
        --green: #3fb950;
        --orange: #d29922;
        --purple: #bc8cff;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .label {
      fill: var(--text);
      font-size: 17px;
      font-weight: 650;
      text-anchor: middle;
    }

    .sub-label {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .road-dashes {
      animation: road-flow 1.2s linear infinite;
    }

    .station-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes road-flow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 0; transform: scale(1.45); }
    }
  </style>

  <rect x="10" y="8" width="880" height="164" rx="20" fill="var(--card)"/>

  <path id="car-path" d="M70 90 H855" fill="none" stroke="none"/>
  <path d="M70 90 H880" fill="none" stroke="var(--road)" stroke-width="30" stroke-linecap="round"/>
  <path class="road-dashes" d="M70 90 H880" fill="none" stroke="var(--lane)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 18"/>

  <g>
    <circle class="station-ring" cx="70" cy="90" r="18" fill="none" stroke="var(--blue)" stroke-width="3"/>
    <circle cx="70" cy="90" r="9" fill="var(--blue)" stroke="var(--card)" stroke-width="4"/>
    <path d="M70 72 V52" stroke="var(--blue)" stroke-width="2"/>
    <text class="label" x="70" y="28">2本软件工程</text>
    <text class="sub-label" x="70" y="47">起点</text>
  </g>

  <g>
    <circle class="station-ring" cx="290" cy="90" r="18" fill="none" stroke="var(--green)" stroke-width="3" style="animation-delay: .45s"/>
    <circle cx="290" cy="90" r="9" fill="var(--green)" stroke="var(--card)" stroke-width="4"/>
    <path d="M290 108 V127" stroke="var(--green)" stroke-width="2"/>
    <text class="label" x="290" y="150">后端开发</text>
    <text class="sub-label" x="290" y="167">2 年半</text>
  </g>

  <g>
    <circle class="station-ring" cx="510" cy="90" r="18" fill="none" stroke="var(--orange)" stroke-width="3" style="animation-delay: .9s"/>
    <circle cx="510" cy="90" r="9" fill="var(--orange)" stroke="var(--card)" stroke-width="4"/>
    <path d="M510 72 V52" stroke="var(--orange)" stroke-width="2"/>
    <text class="label" x="510" y="28">英国 CS 硕士</text>
    <text class="sub-label" x="510" y="47">继续学习</text>
  </g>

  <g>
    <circle class="station-ring" cx="730" cy="90" r="18" fill="none" stroke="var(--purple)" stroke-width="3" style="animation-delay: 1.35s"/>
    <circle cx="730" cy="90" r="9" fill="var(--purple)" stroke="var(--card)" stroke-width="4"/>
    <path d="M730 108 V127" stroke="var(--purple)" stroke-width="2"/>
    <text class="label" x="730" y="150">大模型</text>
    <text class="sub-label" x="730" y="167">2 年+</text>
  </g>

  <g transform="translate(-29 -28)">
    <animateMotion
      dur="12s"
      repeatCount="indefinite"
      rotate="0"
      keyPoints="0;0;0.280;0.280;0.561;0.561;0.841;0.841;1;1"
      keyTimes="0;0.10;0.23;0.34;0.47;0.58;0.71;0.83;0.93;1"
      calcMode="linear">
      <mpath href="#car-path"/>
    </animateMotion>

    <ellipse cx="30" cy="50" rx="31" ry="5" fill="#000000" opacity="0.14"/>
    <path d="M8 26 H18 L25 14 H45 L54 26 H58 C62 26 65 30 65 34 V43 H3 V31 C3 28 5 26 8 26Z" fill="#ff5a5f" stroke="#b4232b" stroke-width="2"/>
    <path d="M27 17 H43 L50 26 H22Z" fill="#dff3ff" stroke="#b4232b" stroke-width="1.5"/>
    <rect x="8" y="30" width="9" height="5" rx="2.5" fill="#ffd33d"/>
    <rect x="53" y="30" width="9" height="5" rx="2.5" fill="#ffd33d"/>
    <circle cx="17" cy="43" r="7" fill="#24292f"/>
    <circle cx="17" cy="43" r="3" fill="#8c959f"/>
    <circle cx="52" cy="43" r="7" fill="#24292f"/>
    <circle cx="52" cy="43" r="3" fill="#8c959f"/>
  </g>
</svg>
