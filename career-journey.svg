<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Limouren 的学习与职业路线</title>
  <desc id="desc">一辆小车从2本软件工程出发，依次经过后端开发两年半、英国计算机科学硕士，抵达大模型算法与 AI 应用开发。</desc>

  <style>
    :root {
      --text: #24292f;
      --muted: #57606a;
      --road: #d0d7de;
      --lane: #ffffff;
      --card: #f6f8fa;
      --blue: #0969da;
      --green: #1a7f37;
      --orange: #bf8700;
      --purple: #8250df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f0f6fc;
        --muted: #8c959f;
        --road: #30363d;
        --lane: #8c959f;
        --card: #161b22;
        --blue: #58a6ff;
        --green: #3fb950;
        --orange: #d29922;
        --purple: #bc8cff;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .label {
      fill: var(--text);
      font-size: 17px;
      font-weight: 650;
      text-anchor: middle;
    }

    .sub-label {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .road-dashes {
      animation: road-flow 1.2s linear infinite;
    }

    .station-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes road-flow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 0; transform: scale(1.45); }
    }
  </style>

  <rect x="16" y="16" width="968" height="268" rx="24" fill="var(--card)"/>

  <text x="500" y="49" fill="var(--text)" font-size="18" font-weight="700" text-anchor="middle">从软件工程到大模型</text>

  <path id="car-path" d="M100 160 H900" fill="none" stroke="none"/>
  <path d="M100 160 H900" fill="none" stroke="var(--road)" stroke-width="34" stroke-linecap="round"/>
  <path class="road-dashes" d="M100 160 H900" fill="none" stroke="var(--lane)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 18"/>

  <g>
    <circle class="station-ring" cx="100" cy="160" r="18" fill="none" stroke="var(--blue)" stroke-width="3"/>
    <circle cx="100" cy="160" r="9" fill="var(--blue)" stroke="var(--card)" stroke-width="4"/>
    <path d="M100 142 V103" stroke="var(--blue)" stroke-width="2"/>
    <text class="label" x="100" y="84">2本软件工程</text>
    <text class="sub-label" x="100" y="104">起点</text>
  </g>

  <g>
    <circle class="station-ring" cx="360" cy="160" r="18" fill="none" stroke="var(--green)" stroke-width="3" style="animation-delay: .45s"/>
    <circle cx="360" cy="160" r="9" fill="var(--green)" stroke="var(--card)" stroke-width="4"/>
    <path d="M360 178 V216" stroke="var(--green)" stroke-width="2"/>
    <text class="label" x="360" y="240">后端开发</text>
    <text class="sub-label" x="360" y="260">2 年半</text>
  </g>

  <g>
    <circle class="station-ring" cx="620" cy="160" r="18" fill="none" stroke="var(--orange)" stroke-width="3" style="animation-delay: .9s"/>
    <circle cx="620" cy="160" r="9" fill="var(--orange)" stroke="var(--card)" stroke-width="4"/>
    <path d="M620 142 V103" stroke="var(--orange)" stroke-width="2"/>
    <text class="label" x="620" y="84">英国 CS 硕士</text>
    <text class="sub-label" x="620" y="104">继续学习</text>
  </g>

  <g>
    <circle class="station-ring" cx="900" cy="160" r="18" fill="none" stroke="var(--purple)" stroke-width="3" style="animation-delay: 1.35s"/>
    <circle cx="900" cy="160" r="9" fill="var(--purple)" stroke="var(--card)" stroke-width="4"/>
    <path d="M900 178 V216" stroke="var(--purple)" stroke-width="2"/>
    <text class="label" x="900" y="240">大模型算法</text>
    <text class="sub-label" x="900" y="260">&amp; AI 应用开发</text>
  </g>

  <g transform="translate(-29 -28)">
    <animateMotion
      dur="12s"
      repeatCount="indefinite"
      rotate="0"
      keyPoints="0;0;0.325;0.325;0.65;0.65;1;1"
      keyTimes="0;0.12;0.27;0.39;0.54;0.66;0.84;1"
      calcMode="linear">
      <mpath href="#car-path"/>
    </animateMotion>

    <ellipse cx="30" cy="50" rx="31" ry="5" fill="#000000" opacity="0.14"/>
    <path d="M8 26 H18 L25 14 H45 L54 26 H58 C62 26 65 30 65 34 V43 H3 V31 C3 28 5 26 8 26Z" fill="#ff5a5f" stroke="#b4232b" stroke-width="2"/>
    <path d="M27 17 H43 L50 26 H22Z" fill="#dff3ff" stroke="#b4232b" stroke-width="1.5"/>
    <rect x="8" y="30" width="9" height="5" rx="2.5" fill="#ffd33d"/>
    <rect x="53" y="30" width="9" height="5" rx="2.5" fill="#ffd33d"/>
    <circle cx="17" cy="43" r="7" fill="#24292f"/>
    <circle cx="17" cy="43" r="3" fill="#8c959f"/>
    <circle cx="52" cy="43" r="7" fill="#24292f"/>
    <circle cx="52" cy="43" r="3" fill="#8c959f"/>
  </g>
</svg>
